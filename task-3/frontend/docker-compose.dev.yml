services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://127.0.0.1:8000}
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

volumes:
  node_modules:
